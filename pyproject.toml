[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishdrift"
version = "0.2.0"
description = "Phishing detector from pooled datasets: data pipeline, models, extension."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "dnspython>=2.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "requests>=2.31",
  "tldextract>=5.1",
  "tranco>=0.8",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18", "ucimlrepo>=0.0.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
phishdrift-collect = "collector.__main__:main"
phishdrift-build = "data_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["phishdrift*", "collector*", "data_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
