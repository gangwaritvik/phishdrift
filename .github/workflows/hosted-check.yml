name: Hosted AI check probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/hosted-check.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in a1-test-site.com b2-shop-login.net c3-bank-verify.top d4-news-daily.org e5-game-hub.io f6-mail-update.xyz; do
            curl -sS -m 40 -w '\nHTTP %{http_code} %{time_total}s\n' -X POST \
              https://loquacious-starship-3425f0.netlify.app/api/llm-check \
              -H 'Content-Type: application/json' -d "{\"domain\":\"$h\"}"
          done
