name: Tier C runner probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/tier-c-probe.yml", "scripts/tier_c_probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/tier_c_probe.py 100
