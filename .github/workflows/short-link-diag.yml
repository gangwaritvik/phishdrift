name: Short-link diagnostic
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Plain requests with our own User-Agent (headers + first 1800 bytes)
        run: |
          UA="PhishDrift-link-check"
          for u in https://tinyurl.com/2wjsu676 https://preview.tinyurl.com/2wjsu676 http://www.cutt.ly/ZyWDEv25/ https://cutt.ly/ZyWDEv25; do
            echo "=== HEAD $u"
            curl -sS -I -m 10 -A "$UA" "$u" | head -20 || true
            echo "=== GET $u"
            curl -sS -m 10 -A "$UA" -D - "$u" | head -c 1800 || true
            echo
          done
