name: Page-read survey
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/page-read-survey.yml", "js/bench/page_read_survey.mjs"]
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://loquacious-starship-3425f0.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # popular legitimate sites (homepages and a few inner pages); plain GETs, nothing is run
      - run: >
          node js/bench/page_read_survey.mjs
          https://www.wikipedia.org/ https://en.wikipedia.org/wiki/Phishing https://github.com/ https://stackoverflow.com/
          https://www.nytimes.com/ https://www.bbc.com/ https://www.cnn.com/ https://www.amazon.com/ https://www.ebay.com/
          https://www.apple.com/ https://www.microsoft.com/ https://www.linkedin.com/ https://www.reddit.com/
          https://x.com/ https://www.facebook.com/ https://www.instagram.com/ https://www.netflix.com/
          https://www.spotify.com/ https://www.paypal.com/ https://www.dropbox.com/ https://zoom.us/
          https://www.adobe.com/ https://www.yahoo.com/ https://duckduckgo.com/ https://www.imdb.com/
          https://www.craigslist.org/ https://medium.com/ https://www.python.org/ https://www.mozilla.org/
          https://www.nasa.gov/ https://www.google.com/ https://www.youtube.com/ https://www.whatsapp.com/
          https://www.flipkart.com/ https://www.hdfcbank.com/ https://www.sbi.co.in/
