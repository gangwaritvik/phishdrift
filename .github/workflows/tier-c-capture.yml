name: Tier C capture
# Every 12 h: poll the live phishing feeds and capture RDAP / DNS / TLS facts of each new
# registrable domain (both classes), then append them to the orphan branch `tier-c-data`.
# Datasets are never committed to main. Scheduled runs use the default branch's copy of this file.
on:
  schedule:
    - cron: "20 5,17 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/tier-c-capture.yml"]
permissions:
  contents: write
concurrency:
  group: tier-c-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Fetch the data branch
        run: |
          git clone --depth 1 --branch tier-c-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" databranch
          mkdir -p data
          cp -r databranch/data/. data/
      - name: Capture
        run: python -u -m collector run --no-crawl
      - name: Summary
        if: always()
        run: |
          ls -la data/interim/domain_info || true
          python - <<'PY'
          import glob, json
          n = {"domain": 0, "host": 0}
          for f in glob.glob("data/interim/domain_info/*.jsonl"):
              for line in open(f):
                  try:
                      n[json.loads(line)["kind"]] += 1
                  except Exception:
                      pass
          print("records so far:", n)
          PY
      - name: Push the new captures
        if: always()
        run: |
          mkdir -p databranch/data/interim
          cp -r data/interim/domain_info databranch/data/interim/
          cp data/interim/feeds_first_seen.parquet databranch/data/interim/ || true
          cd databranch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin tier-c-data && exit 0
            sleep $((i * 5)); git pull --rebase origin tier-c-data
          done
          exit 1
