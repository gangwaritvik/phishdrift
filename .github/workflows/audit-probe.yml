name: Audit probe (live demo site)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/audit-probe.yml"]
env:
  SITE: https://loquacious-starship-3425f0.netlify.app
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live site files
        run: |
          for p in / demo/index.html demo/check.js js/data/lists.json js/data/tier_a_hybrid.json data/lists/blocklist.json; do
            curl -sS -o /tmp/f -m 60 -w "$p HTTP %{http_code} %{size_download} bytes\n" "$SITE/$p" || echo "$p FAILED"
          done
          echo "--- does the live check.js follow short links?"
          curl -sS -m 30 "$SITE/demo/check.js" | grep -c "c.expand" || true
          echo "--- does it know the local-address rule?"
          curl -sS -m 30 "$SITE/demo/check.js" | grep -c "isLocalAddress" || true
      - name: Live /api/expand
        run: |
          for u in https://aka.ms/vscode https://aka.ms/windowsterminal http://www.cutt.ly/ZyWDEv25/ https://tinyurl.com/2wjsu676 https://bit.ly/3 https://t.co/x https://is.gd/x https://example.com/ http://127.0.0.1/; do
            echo "== $u"
            curl -sS -m 40 -w '\nHTTP %{http_code} %{time_total}s\n' -X POST "$SITE/api/expand" -H 'Content-Type: application/json' -d "{\"url\":\"$u\"}" | cut -c1-400
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Live page in a browser
        run: |
          mkdir /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.50.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const u of ["https://aka.ms/vscode", "https://tinyurl.com/2wjsu676", "http://192.168.0.1/", "https://www.google.com/"]) {
            const p = await b.newPage();
            const t0 = Date.now();
            await p.goto(process.env.SITE + "/demo/index.html");
            await p.waitForSelector("#go:not([disabled])", { timeout: 120000 });
            console.log("model loaded in", Date.now() - t0, "ms");
            await p.fill("#url", u);
            await p.click("#go");
            await p.waitForTimeout(25000);
            if (await p.isEnabled("#skip")) await p.click("#skip");
            await p.waitForTimeout(2000);
            const txt = (await p.innerText("#stage")).replace(/\s+/g, " ").slice(0, 700);
            console.log("== " + u + "\n" + txt + "\n");
            await p.close();
          }
          await b.close();
          JS
          node run.mjs
