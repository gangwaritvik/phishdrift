<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<title>PhishDrift</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
  [hidden] { display: none !important; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; font: var(--dw) 17px var(--display); }
  .mk { width: 26px; height: 26px; border-radius: calc(var(--r) / 3); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .mk svg { width: 15px; height: 15px; }
  .vb { background: var(--stage); border-radius: calc(var(--r) * .7); padding: 14px 16px; border: var(--bw) solid var(--line); box-shadow: var(--shadow); }
  h1 { margin: 0; font: var(--dw) 22px/1.15 var(--display); letter-spacing: -.02em; color: var(--tone); }
  [data-theme=terminal] h1 { font-size: 30px; letter-spacing: 0; }
  #site { margin-top: 4px; font: 13px var(--mono); color: var(--mute); overflow-wrap: anywhere; }
  ul { list-style: none; margin: 12px 0 4px; padding: 0; display: grid; gap: 6px; }
  li { position: relative; padding-left: 18px; }
  li::before { content: ""; position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); }
  .muted { color: var(--mute); font-size: 12.5px; }
  .row { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
  button.act { font: 600 13px var(--body); padding: 0 14px; min-height: 36px; border-radius: var(--pill); border: max(var(--bw), 1px) solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.act:hover { border-color: var(--accent); }
  .sec { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .sec label { display: flex; gap: 8px; align-items: flex-start; }
  input[type=checkbox] { accent-color: var(--accent); margin-top: 2px; }
  input[type=url] { width: 100%; margin-top: 4px; padding: 7px 10px; font: 12.5px var(--mono); background: var(--card); color: var(--fg); border: max(var(--bw), 1px) solid var(--line); border-radius: calc(var(--r) / 3); }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--mute); font-size: 12.5px; }
  details label { display: block; margin-top: 8px; }
  #status { min-height: 1em; margin-top: 8px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .lens button { width: 26px; height: 26px; }
  .lens { padding: 3px; gap: 5px; }
  .lens button span { top: auto; bottom: calc(100% + 8px); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body data-verdict="safe">
  <div class="top"><div class="logo"><span class="mk"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-6 6-6 9-2s6 3 9-4"/><circle cx="19" cy="6" r="1.6" fill="currentColor" stroke="none"/></svg></span>PhishDrift</div></div>
  <section class="vb">
    <h1 id="headline">Checking...</h1>
    <div id="site"></div>
    <ul id="reasons"></ul>
    <div class="muted" id="notes"></div>
  </section>
  <div class="row">
    <button class="act" id="trust" hidden>Trust this site</button>
    <button class="act" id="report" hidden>Report a false alarm</button>
  </div>
  <div class="sec muted">
    <label><input type="checkbox" id="llm"><span>Ask an AI about borderline sites (sends only the website name to the backend)</span></label>
  </div>
  <details>
    <summary>Advanced settings</summary>
    <label class="muted">AI check address (empty = your backend)
      <input type="url" id="llmUrl" placeholder="https://your-site.netlify.app/llm-check">
    </label>
    <label class="muted">Domain check address (empty = off)
      <input type="url" id="tierCUrl" placeholder="https://your-site.netlify.app/api/domain-check">
    </label>
  </details>
  <div class="muted" id="status" role="status"></div>
  <div class="foot"><span class="muted">Theme</span><div class="lens" id="lens"></div></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
