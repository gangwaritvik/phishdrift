<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dangerous page blocked</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--stage); color: var(--fg); font: 16px/1.5 var(--body); }
  main { width: min(600px, calc(100% - 32px)); margin: 16px; padding: 34px 38px 28px; background: var(--card); border: max(var(--bw), 1px) solid var(--line); border-radius: var(--r); box-shadow: var(--shadow), 0 20px 40px rgba(0,0,0,.12); }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  h1 { margin: 10px 0 10px; font: var(--dw) 48px/1 var(--display); letter-spacing: -.03em; color: var(--bad); }
  [data-theme=terminal] h1 { font-size: 72px; letter-spacing: 0; }
  #target { display: inline-block; padding: 2px 8px; background: var(--hl); color: var(--hl-fg); border-radius: 5px; font: 500 15px var(--mono); overflow-wrap: anywhere; }
  ul { margin: 14px 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  li { position: relative; padding-left: 20px; }
  li::before { content: ""; position: absolute; left: 0; top: .55em; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  #note, #status { color: var(--mute); font-size: .9rem; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 22px; align-items: center; }
  button { font: 600 15px var(--body); padding: 0 22px; min-height: 44px; border-radius: var(--pill); cursor: pointer; border: max(var(--bw), 1px) solid var(--accent); background: var(--accent); color: var(--on-accent); }
  button.link { background: none; border: none; color: var(--mute); text-decoration: underline; padding: 0; font-weight: 400; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .lens button { width: 28px; height: 28px; min-height: 0; } .lens { padding: 3px; gap: 5px; }
  .lens button span { top: auto; bottom: calc(100% + 8px); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body data-verdict="dangerous">
<main>
  <div class="eyebrow">Site blocked</div>
  <h1>Dangerous site</h1>
  <p>PhishDrift stopped this page before it opened because it is very likely to be phishing.</p>
  <p><code id="target"></code></p>
  <p>Why:</p>
  <ul id="reasons"></ul>
  <p id="note"></p>
  <div class="row">
    <button id="back">Take me back to safety</button>
    <button class="link" id="proceed">Proceed anyway</button>
    <button class="link" id="report">This is a mistake</button>
  </div>
  <p id="status" role="status"></p>
  <div class="foot"><span class="eyebrow">Theme</span><div class="lens" id="lens"></div></div>
</main>
<script src="warning.js" type="module"></script>
</body>
</html>
