<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dangerous page blocked</title>
<style>
  :root { --bg: #fff1f2; --fg: #450a0a; --card: #ffffff; --accent: #b91c1c; --muted: #7f1d1d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c0a0a; --fg: #fee2e2; --card: #2a1111; --accent: #f87171; --muted: #fca5a5; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
    color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 16px; padding: 24px; background: var(--card);
    border-top: 6px solid var(--accent); border-radius: 8px; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; color: var(--accent); }
  code { word-break: break-all; }
  ul { padding-left: 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.link { background: none; border: none; color: var(--muted); text-decoration: underline;
    padding: 0; }
  #status { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Dangerous page blocked</h1>
  <p>PhishDrift stopped this page before it opened because it is very likely to be phishing.</p>
  <p><code id="target"></code></p>
  <p>Why:</p>
  <ul id="reasons"></ul>
  <p id="note"></p>
  <div class="row">
    <button id="back">Take me back to safety</button>
    <button class="link" id="proceed">Proceed anyway</button>
    <button class="link" id="report">This is a mistake</button>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="warning.js" type="module"></script>
</body>
</html>
