# Tier A URL feature engine. Word lists are collected by `python -m features lists`
# (run on a PC with internet) and frozen into configs/lists/ and configs/platforms.yaml.
# Popularity (Tranco rank, traffic) is never used to choose list entries.

lists:
  psl_url: https://publicsuffix.org/list/public_suffix_list.dat   # private section = hosting platforms
  platform_extra_urls: []                                          # more one-domain-per-line lists
  platform_extras: [bit.ly, tinyurl.com]                           # shorteners are masked too: they hide the target

  # Brands: everything below is merged; entries shorter than 4 characters are dropped.
  wikidata_min_sitelinks: 40        # widely known organisations only (language editions, not traffic)
  wikidata_types:                   # one light query per type (direct instance-of); the old single
    - Q4830453                      # query with a subclass path (P279*) returned 504 from Wikidata
    - Q783794
    - Q6881511
    - Q891723
    - Q22687
    - Q1058914
    - Q35127
  wikidata_query: |
    SELECT ?label ?site WHERE {{
      ?item wdt:P31 wd:{type} ;
            wdt:P856 ?site ;
            wikibase:sitelinks ?n ;
            rdfs:label ?label .
      FILTER(LANG(?label) = "en" && ?n >= {min_sitelinks})
    }}
    LIMIT 4000
  brand_urls: []                    # extra plain-text brand lists (one per line), e.g. exported Phishpedia targets
  brand_files:                      # reviewed lists kept in the repo (one per line, # comments)
    - configs/lists/brand_additions.txt   # phishing-feed evidence, reviewed by Ritvik; see the file header
  brand_exclude:                    # generic words removed after review (Ritvik, 2026-10-12); applied last
    [archive, bank, chess, delta, global, group, holdings, home, meta, next, orange, people, shell, united]
  brand_seed:                       # starting set, used when no network source answers
