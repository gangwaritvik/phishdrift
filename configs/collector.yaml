# Live collector. Secrets come from environment variables, never from this file.
# Run every 12 hours (scripts/schedule_collector.ps1 on Windows, scripts/cron_example.txt elsewhere).
# Feeds are cached for their polling interval, so running more often does not poll them faster.

paths:
  raw_dir: data/raw/feeds              # training feeds: data/raw/feeds/YYYY-MM-DD/<feed>.parquet
  blocklist_dir: data/raw/blocklists   # blocklist-only feeds; never training data
  crawl_dir: data/raw/crawl            # benign inner pages: data/raw/crawl/YYYY-MM-DD/<seed_source>.parquet
  ood_dir: data/raw/ood                # out-of-distribution legitimate pages (evaluation only); the corpus build never reads it
  seed_dir: data/interim/seeds         # crawl seed lists written by `python -m data_pipeline seeds`
  index_path: data/interim/feeds_first_seen.parquet
  domain_info_dir: data/interim/domain_info   # first-seen RDAP/DNS/TLS captures (JSONL per day)
  http_cache_dir: .cache/http

run:                                   # one collector run at a time (a scheduled and a manual run would race on the index)
  lock_path: data/interim/collector.lock
  lock_stale_s: 11400                  # a lock older than this was left by a killed run (task limit is 3 h)

http:
  timeout_s: 20
  retries: 3
  backoff_factor: 2.0                  # waits 2s, 4s, 8s between retries
  user_agent: "PhishDrift-research-collector/0.2 (academic project; https://github.com/gangwaritvik/phishdrift)"
  max_download_s: 30                   # a response that takes longer than this in total is dropped
  default_min_interval_s: 1.0          # politeness delay between requests to the same host

feeds:
  openphish:                           # main live source; community feed, non-commercial only
    enabled: true
    role: training
    url: https://openphish.com/feed.txt
    cache_ttl_s: 41400                 # 11.5 h, just under the 12 h schedule: a run a few seconds early must still refetch
  phishing_database:                   # secondary live source; MIT license
    enabled: true
    role: training
    url: https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-links-NEW-today.txt
    cache_ttl_s: 41400
  phishtank:                           # secondary only: registration closed, survivorship bias
    enabled: true
    role: training
    url_with_key: "http://data.phishtank.com/data/{key}/online-valid.csv"
    key_env: PHISHTANK_APP_KEY         # skipped (with a log line) when unset
    cache_ttl_s: 41400
  urlhaus:                             # blocklist only: mostly malware, not phishing training data
    enabled: true
    role: blocklist
    url: https://urlhaus.abuse.ch/downloads/csv_recent/
    auth_key_env: URLHAUS_AUTH_KEY     # sent as the Auth-Key header when set
    cache_ttl_s: 41400

crawler:                               # benign inner pages; robots.txt and Crawl-delay obeyed
  enabled: true
  inner_pages_min: 3                   # domains yielding fewer allowed inner pages are logged
  inner_pages_max: 5
  max_sitemaps_per_domain: 2
  max_page_bytes: 5000000
  store_html: true                     # fetch each chosen inner page's HTML (benign sites only)
  max_crawl_delay_s: 10                # skip domains asking for a longer Crawl-delay
  domain_deadline_s: 240               # no new requests to a site after this many seconds
  http:                                # overrides of the http section for the crawler only
    retries: 1                         # dead sites are common: fail fast
    connect_timeout_s: 8
    backoff_factor: 1.0
  workers: 48                          # sites crawled in parallel (each host still waits its own delay)
  checkpoint_every: 25                 # results are saved after every this many domains
  seeds:
    popular:                           # CrUX hosts, inner pages with HTML; pages belong to the "popular" source
      from: crux
      scheduled: false
      retry_errors: true               # sites that failed or timed out are tried again next run
      domains_per_run: 1500
      include_homepage: false
    popular_urls:                      # CrUX hosts, sitemap URLs only: no page download, up to 20 per site
      from: crux
      source: popular                  # pages belong to the "popular" source
      scheduled: false
      retry_errors: true
      domains_per_run: 5000
      include_homepage: false
      crawl: {store_html: false, inner_pages_max: 20}   # overrides of the crawler section for this set
    commoncrawl:                       # CrUX hosts, URLs from the Common Crawl index (no HTML)
      from: commoncrawl
      source: popular                  # pages belong to the "popular" source with the crawled ones
      scheduled: false
      retry_errors: true
      domains_per_run: 3000
      include_homepage: false
    live:                              # Tranco-seeded pages belong to the "live" source
      from: tranco                     # via the `tranco` package; rank never becomes a feature
      top_n: 100000
      domains_per_run: 60
      include_homepage: true
    phiusiil:                          # inner pages of PhiUSIIL legitimate domains
      from: seed_file
      domains_per_run: 60
      include_homepage: false          # PhiUSIIL already has the homepages
    urlphish:
      from: seed_file
      domains_per_run: 30
      include_homepage: false
  tranco_cache_dir: .cache/tranco

# Deep legitimate URLs of popular sites (collector/popular.py); run by name, not in the 12 h run:
#   python -m collector crawl --seeds popular commoncrawl      (rerun to continue; done hosts are skipped)
popular:
  origins_url: https://raw.githubusercontent.com/zakird/crux-top-lists/main/data/global/{month}.csv.gz
  months_back: 3                       # newest monthly file that downloads
  cache_ttl_s: 604800
  timeout_s: 300
  skip_rank: 1000                      # the head is allowlist territory; CrUX ranks are bucket upper bounds
  max_rank: 100000
  seed: 20261020                       # fixed: same list and exclusions give the same host order
  commoncrawl:
    collections_url: https://index.commoncrawl.org/collinfo.json
    timeout_s: 60
    min_interval_s: 1.0                # the index asks clients to be gentle: one request a second
    workers: 3                         # the index server is slow and resets busy clients: few at once
    connect_timeout_s: 30              # its connections are slow to open (8 s timed out for every site)
    retries: 4                         # resets and timeouts are retried with a growing wait
    backoff_factor: 3.0
    max_consecutive_errors: 6          # that many sites in a row failing: the index is down, stop this run
    fetch_limit: 300                   # CDX lines read at the chosen index page
    per_host: 10                       # deep URLs kept per host
    min_pages: 3                       # fewer is logged as few_pages

domain_capture:                        # tier C raw facts, captured once per new live domain
  enabled: true
  unit: domain                         # one record per registrable domain (all the deployed check knows); the apex is probed, www. when the apex does not resolve
  max_domains_per_run: 1500            # domains per run: feed phishing first, then legitimate domains
  workers: 8                           # hosts captured at once (RDAP servers still get the 1 s politeness delay)
  job_deadline_s: 300                  # a host still being looked up after this is abandoned (retried next run)
  checkpoint_every: 25                 # captured hosts are appended to the JSONL after every this many
  time_budget_s: 5400                  # no new host is started after 1.5 h (the rest waits for the next run)
  backlog_hours: 48                    # hosts first seen within this window and not yet captured are retried
  rdap_url: "https://rdap.org/domain/{domain}"
  rdap_retries: 2                      # a failed lookup (rate limit, timeout) is retried on up to 2 later runs
  dns_resolver: doh                    # DNS over HTTPS to public resolvers that do not filter: the PC's own
  doh_urls:                            # resolver answers 0.0.0.0 for known phishing hosts (a blocklist verdict)
    - https://8.8.8.8/resolve          # by IP, so the filtering resolver is never asked for the DoH host
    - https://1.1.1.1/dns-query
  dns_timeout_s: 5
  tls: true                            # TLS handshake only (no page fetch) to read the certificate
  tls_timeout_s: 8
  benign:                              # legitimate hosts captured the same way (label 0), so tier C has both classes
    enabled: true
    per_run: 1500                      # registrable domains per run (with unit: host each is captured as <domain> and www.<domain>)
    seed: 20261013                     # varied per run (date and half-day), so every run draws new domains
    skip_top_n: 1000                   # the head of the list is allowlist territory
    bands:                             # Tranco rank ranges to spread the sample over; rank is never stored or a feature
      - {from_rank: 1001, to_rank: 10000, share: 0.15}
      - {from_rank: 10001, to_rank: 100000, share: 0.25}
      - {from_rank: 100001, to_rank: 1000000, share: 0.60}

ood:                                   # `python -m collector crawl-ood`: legitimate inner pages for the OOD false-positive set
  seed: 20261012                       # fixed: the same Tranco list and exclusions give the same sample
  sample_size: 1500                    # registrable domains
  skip_top_n: 1000                     # head of the Tranco list is skipped (allowlist territory)
  bands:                               # rank ranges (1-based, inclusive) the sample is spread over; rank is never stored
    - {from_rank: 1001, to_rank: 10000, share: 0.25}
    - {from_rank: 10001, to_rank: 50000, share: 0.25}
    - {from_rank: 50001, to_rank: 200000, share: 0.25}
    - {from_rank: 200001, to_rank: 1000000, share: 0.25}
  skip_platforms: true                 # hosting platforms (configs/platforms.yaml) are not sampled
  exclude_files:                       # in paths.processed_dir (datasets.yaml); the `domain` column is read; missing files are skipped
    - meta_pool.parquet
    - meta_time_slice.parquet
    - meta_heldout_source.parquet
    - pool.parquet
    - time_slice.parquet
    - heldout_source.parquet
    - eval_only.parquet
  exclude_crawl_attempts: true         # also skip every site the training crawl tried (paths.crawl_dir)
  exclude_feed_index: true             # and every domain in the live-feed first-seen index
  store_html: false                    # URLs and crawl status only; true also fetches and keeps each page's HTML
  inner_pages_min: 3
  inner_pages_max: 5
  checkpoint_every: 25                 # results are saved and a progress line printed after every this many sites
  lock_stale_s: 3600                   # a lock not refreshed for this long was left by a killed run

shorteners:                            # `python -m collector learn-shorteners`: hosts that only forward visitors
  min_short_urls: 20                   # candidate = a registrable domain with this many one-segment, short-token feed URLs
  max_token_len: 12                    # longest path token that counts as a short link code
  probe_urls: 5                        # short URLs probed per candidate (HEAD, redirects not followed, no body)
  min_answered: 3                      # fewer answered probes: no decision
  min_redirect_share: 0.8              # share of answered probes that redirect to another registrable domain
  max_candidates: 3000                 # probe the most-used candidates first
  workers: 16
  probe_timeout_s: 8
  out_list: data/interim/learned_shorteners.txt
  out_table: reports/tables/learned_shorteners.csv
  extra_url_files: []                  # optional feed dumps, one URL per line (e.g. Phishing.Database ACTIVE)
