# Live collector. Secrets come from environment variables, never from this file.
# Run every 12 hours (scripts/cron_example.txt). Feeds are cached for their polling interval,
# so running more often does not poll them faster.

paths:
  raw_dir: data/raw/feeds              # training feeds: data/raw/feeds/YYYY-MM-DD/<feed>.parquet
  blocklist_dir: data/raw/blocklists   # blocklist-only feeds; never training data
  crawl_dir: data/raw/crawl            # benign inner pages: data/raw/crawl/YYYY-MM-DD/<seed_source>.parquet
  seed_dir: data/interim/seeds         # crawl seed lists written by `python -m data_pipeline seeds`
  index_path: data/interim/feeds_first_seen.parquet
  domain_info_dir: data/interim/domain_info   # first-seen RDAP/DNS/TLS captures (JSONL per day)
  http_cache_dir: .cache/http

http:
  timeout_s: 20
  retries: 3
  backoff_factor: 2.0                  # waits 2s, 4s, 8s between retries
  user_agent: "PhishDrift-research-collector/0.2 (academic project; https://github.com/gangwaritvik/phishdrift)"
  default_min_interval_s: 1.0          # politeness delay between requests to the same host

feeds:
  openphish:                           # main live source; community feed, non-commercial only
    enabled: true
    role: training
    url: https://openphish.com/feed.txt
    cache_ttl_s: 43200                 # 12 h: also the minimum polling interval
  phishing_database:                   # secondary live source; MIT license
    enabled: true
    role: training
    url: https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-links-NEW-today.txt
    cache_ttl_s: 43200
  phishtank:                           # secondary only: registration closed, survivorship bias
    enabled: true
    role: training
    url_with_key: "http://data.phishtank.com/data/{key}/online-valid.csv"
    key_env: PHISHTANK_APP_KEY         # skipped (with a log line) when unset
    cache_ttl_s: 43200
  urlhaus:                             # blocklist only: mostly malware, not phishing training data
    enabled: true
    role: blocklist
    url: https://urlhaus.abuse.ch/downloads/csv_recent/
    auth_key_env: URLHAUS_AUTH_KEY     # sent as the Auth-Key header when set
    cache_ttl_s: 43200

crawler:                               # benign inner pages; robots.txt and Crawl-delay obeyed
  enabled: true
  inner_pages_min: 3                   # domains yielding fewer allowed inner pages are logged
  inner_pages_max: 5
  max_sitemaps_per_domain: 2
  max_page_bytes: 5000000
  store_html: true                     # fetch each chosen inner page's HTML (benign sites only)
  max_crawl_delay_s: 10                # skip domains asking for a longer Crawl-delay
  seeds:
    live:                              # Tranco-seeded pages belong to the "live" source
      from: tranco                     # via the `tranco` package; rank never becomes a feature
      top_n: 100000
      domains_per_run: 60
      include_homepage: true
    phiusiil:                          # inner pages of PhiUSIIL legitimate domains
      from: seed_file
      domains_per_run: 60
      include_homepage: false          # PhiUSIIL already has the homepages
    urlphish:
      from: seed_file
      domains_per_run: 30
      include_homepage: false
  tranco_cache_dir: .cache/tranco

domain_capture:                        # tier C raw facts, captured once per new live domain
  enabled: true
  max_domains_per_run: 500
  rdap_url: "https://rdap.org/domain/{domain}"
  dns_timeout_s: 5
  tls: true                            # TLS handshake only (no page fetch) to read the certificate
  tls_timeout_s: 8
