# Daily feed collector. Secrets come from environment variables, never from this file.
paths:
  raw_dir: data/raw/feeds            # one folder per UTC day: data/raw/feeds/YYYY-MM-DD/<source>.parquet
  index_path: data/interim/feeds_first_seen.parquet
  http_cache_dir: .cache/http

http:
  timeout_s: 20
  retries: 3
  backoff_factor: 2.0                # waits 2s, 4s, 8s between retries
  user_agent: "PhishDrift-research-collector/0.1 (academic project; contact via GitHub)"
  default_min_interval_s: 1.0        # politeness delay between requests to the same host

feeds:
  openphish:
    enabled: true
    url: https://openphish.com/feed.txt
    cache_ttl_s: 3300                # also the minimum polling interval
  phishtank:
    enabled: true
    url_with_key: "http://data.phishtank.com/data/{key}/online-valid.csv"
    key_env: PHISHTANK_APP_KEY       # skipped (with a log line) when unset
    cache_ttl_s: 3300
  urlhaus:
    enabled: true
    url: https://urlhaus.abuse.ch/downloads/csv_recent/
    auth_key_env: URLHAUS_AUTH_KEY   # sent as the Auth-Key header when set
    cache_ttl_s: 290
    # URLhaus lists malware-distribution URLs, not phishing. Rows are kept but tagged
    # threat=malware so experiments can include or exclude them explicitly.

benign:
  enabled: true
  tranco_url: https://tranco-list.eu/top-1m.csv.zip
  tranco_cache_ttl_s: 86400
  top_n: 100000                      # sample from the top N domains
  domains_per_day: 200               # domains sampled per daily run (seeded by date)
  inner_pages_per_domain: 5          # inner URLs kept per domain (from sitemap or homepage links)
  max_sitemaps_per_domain: 2
  include_homepage: true
  max_page_bytes: 5000000            # cap on robots.txt / sitemap / homepage downloads
  # Benign free-hosted / platform pages so "deep subdomain on a free host" is not a phishing shortcut.
  # Extend this list with real, legitimate sites you have checked by hand.
  free_hosted_seeds:
    - https://pages.github.com/
    - https://docs.github.com/en/pages
    - https://blog.google/
    - https://wordpress.org/showcase/
