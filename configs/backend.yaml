# FastAPI backend. DNS/TLS timeouts and the RDAP URL are reused from configs/collector.yaml
# (domain_capture); the HTTP client settings below override collector.yaml's `http` section so a
# live request never waits through the collector's slow retries.
#
# The rules under `rules` are hand-made heuristics, not a trained tier C model. Their severities
# are checked against the collector's first-seen captures by `python -m experiments.domain_rules`
# (reports/domain_rules.md); the sample is small, so the intervals there are wide.

lookup:
  overall_timeout_s: 12          # whole domain check; on expiry the answer is "low" + error
  workers: 8                     # threads that run domain checks
  rdap_cache_ttl_s: 86400        # on-disk cache of RDAP responses (domain only, no URLs)
  rdap_min_interval_s: 0.2       # politeness delay between requests to rdap.org
  dns_control_host: a.root-servers.net   # always resolves; if it does not, the resolver is down
  http:
    timeout_s: 6
    retries: 1
    backoff_factor: 1.0
    connect_timeout_s: 4

cache:                           # per-domain, in memory
  ttl_s: 3600
  max_entries: 20000

rate_limit:                      # token bucket per client address
  capacity: 30
  refill_per_s: 0.5
  max_clients: 10000

feedback:
  dir: data/feedback             # one JSON line per report: domain, kind, verdict, timestamp

lists:
  out_dir: data/lists
  prefix_bytes: 6                # hash = sha256(key)[:2 * prefix_bytes] as hex
  allowlist_top_n: 50000         # Tranco rank only cuts the list; never a model feature
  # Open hosting (backend/lists.py): a phishing host below an allowlisted domain makes the child
  # zone that contains it (cloudapp.azure.com, drive.google.com) open: no allowlist there, blocklist
  # by full URL. The whole domain is open when phishing sits under this many different children
  # with at least this many children per phishing URL (one tenant per subdomain, as on weebly.com).
  open_hosting:
    min_tenant_children: 3
    min_children_per_url: 0.5
    min_children_whole: 20           # this many distinct phishing subdomains open the whole domain
                                     # whatever their URL counts (busy tenants, as on mybluehost.me)
    # Phishing on the bare domain counts its first path segment as the tenant (telegra.ph/x); path
    # tenants can only open the whole domain, with the same two thresholds above.
    # Phishing history used only as zone evidence (never blocklisted, never training data). The
    # corpus drops domains seen in several phishing sources (hosting platforms) and our own feeds
    # cover days, so without a long history 000webhostapp.com and the like stayed allowlisted.
    evidence_urls:
      - https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-links-ACTIVE.txt
    evidence_cache_ttl_s: 86400
    evidence_timeout_s: 300

rules:                           # heuristics, see backend/checks.py and reports/domain_rules.md
  very_young_domain_days: 7
  young_domain_days: 30
  free_issuers:                  # substrings of the certificate issuer (lowercase)
    - let's encrypt
    - zerossl
    - buypass
  severity_from_data:            # experiments/domain_rules.py: how the data picks a severity
    high_max_benign_upper: 0.01  # "high" only if the legit rate's 95% upper bound is <= this
    high_min_ratio: 10           # ... and phishing rate / legit upper bound >= this
    warn_min_ratio: 2            # "warn" if that ratio >= this, else "info"
  severity:                      # signal id -> high / warn / info, overrides the code's default;
    domain_unregistered: info    # set from reports/domain_rules.md (2026-10-13 captures): fires on
    tls_unverified: info         # 22.0% / 5.1% of legitimate hosts, no more often on phishing
  risk:
    elevated_warn_count: 1       # this many "warn" signals -> elevated
    high_warn_count: 3           # this many "warn" signals (or any "high") -> high
