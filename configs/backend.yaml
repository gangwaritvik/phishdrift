# FastAPI backend. DNS/TLS timeouts and the RDAP URL are reused from configs/collector.yaml
# (domain_capture); the HTTP client settings below override collector.yaml's `http` section so a
# live request never waits through the collector's slow retries.
#
# The rules under `rules` are hand-made heuristics, not a trained tier C model. Their severities
# are checked against the collector's first-seen captures by `python -m experiments.domain_rules`
# (reports/domain_rules.md); the sample is small, so the intervals there are wide.

lookup:
  overall_timeout_s: 12          # whole domain check; on expiry the answer is "low" + error
  workers: 8                     # threads that run domain checks
  rdap_cache_ttl_s: 86400        # on-disk cache of RDAP responses (domain only, no URLs)
  rdap_min_interval_s: 0.2       # politeness delay between requests to rdap.org
  dns_control_host: a.root-servers.net   # always resolves; if it does not, the resolver is down
  http:
    timeout_s: 6
    retries: 1
    backoff_factor: 1.0
    connect_timeout_s: 4

cache:                           # per-domain, in memory
  ttl_s: 3600
  max_entries: 20000

rate_limit:                      # token bucket per client address
  capacity: 30
  refill_per_s: 0.5
  max_clients: 10000

feedback:
  dir: data/feedback             # one JSON line per report: domain, kind, verdict, timestamp, reporter
  # POST /register issues a per-install token "<install_id>.<hmac>" (no user data); /feedback needs
  # it in the X-PhishDrift-Token header. The HMAC secret comes from this environment variable; if it
  # is unset, a random one is created once in <dir>/.secret (mode 0600) so tokens survive restarts.
  secret_env: PHISHDRIFT_FEEDBACK_SECRET
  register_rate:                 # token bucket per client address, for /register only
    capacity: 3
    refill_per_s: 0.000277778    # 1/3600: one more registration per hour
    max_clients: 10000
  max_per_install_per_day: 20    # accepted reports per install per UTC day, then 429
  dedupe_window_s: 86400         # same install + domain + kind again: answered, not stored again
  max_installs: 100000           # in-memory per-install counters and dedupe keys are capped here

remote_config:                   # GET /config (backend/remote_config.py); checked at start-up
  path: configs/remote_config.yaml
  platforms_file: configs/platforms.yaml   # never_warn may not name a hosting platform
  bounds:                        # every threshold set there must lie in [min, max]
    min: 0.5
    max: 0.9999
  max_never_warn: 200
  list_sync_minutes:
    min: 15
    max: 1440

lists:
  out_dir: data/lists
  prefix_bytes: 8                # blocklist hash = sha256(key)[:2 * prefix_bytes] as hex
  allow_prefix_bytes: 16         # allowlist hashes: 128 bits, so no domain can be registered to
                                 # collide with a trusted one (6 bytes took about 2^48 tries)
  sentinel_top_n: 1000           # allowlist.top: the extension refuses a list that blocks or drops these
  specific_segment_len: 16       # a path segment this long names one object: list the URL without query
  history_keep: 48               # builds kept in <out_dir>/history for /lists/delta
  # ECDSA P-256 key that signs manifest.json and /config (python -m backend make-signing-key).
  # The environment variable, if set, names the key file instead. No key: unsigned (development).
  signing_key: data/keys/list_signing_key.pem
  signing_key_env: PHISHDRIFT_LIST_SIGNING_KEY
  rate:                          # token bucket per client address for /lists/* and /config only,
    capacity: 60                 # so a feedback burst cannot stop list syncs
    refill_per_s: 1.0
    max_clients: 10000
  # Public phishing URL lists blocklisted as they are (one URL per line), on top of our own
  # collector and corpus URLs. Dead links stay until the list drops them (cached 1 day).
  blocklist_feeds:
    - https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-links-ACTIVE.txt
  allowlist_top_n: 50000         # Tranco rank only cuts the list; never a model feature
  # Open hosting (backend/lists.py): a phishing host below an allowlisted domain makes the child
  # zone that contains it (cloudapp.azure.com, drive.google.com) open: no allowlist there, blocklist
  # by full URL. The whole domain is open when phishing sits under this many different children
  # with at least this many children per phishing URL (one tenant per subdomain, as on weebly.com).
  open_hosting:
    min_tenant_children: 3
    min_children_per_url: 0.5
    min_children_whole: 20           # this many distinct phishing subdomains open the whole domain
                                     # whatever their URL counts (busy tenants, as on mybluehost.me)
    # Phishing on the bare domain counts its first path segment as the tenant (telegra.ph/x); path
    # tenants can only open the whole domain, with the same two thresholds above.
    # Phishing history used only as zone evidence (never blocklisted, never training data). The
    # corpus drops domains seen in several phishing sources (hosting platforms) and our own feeds
    # cover days, so without a long history 000webhostapp.com and the like stayed allowlisted.
    evidence_urls:
      - https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-links-ACTIVE.txt
    evidence_cache_ttl_s: 86400
    evidence_timeout_s: 300
  # Popular tenant sites on hosting platforms, allowlisted by exact host (backend/lists.py
  # `tenant_sites`): a platform's domain is never allowlisted, but stitch.withgoogle.com is a site
  # of its own. Host-level popularity from the CrUX top origins (Chrome users; rank only cuts the
  # list, never a model feature). The newest of the last `months_back` monthly files is used.
  tenant_sites:
    origins_url: https://raw.githubusercontent.com/zakird/crux-top-lists/main/data/global/{month}.csv.gz
    months_back: 3
    top_rank: 50000              # CrUX rank bucket, same depth as allowlist_top_n
    cache_ttl_s: 604800
    timeout_s: 300

# LLM second opinion (backend/llm.py), layer 6 of CLAUDE.md. Off until the key variable is set.
# The key stays in the backend machine's environment; only a host and a few path words are sent.
llm:
  provider: gemini
  model: gemini-3.5-flash        # measured on a free key 2026-10-22: 2.1 s per call; 3.8-flash gives HTTP 429, 3.5-flash-lite took 22 s
  url: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
  api_key_env: GEMINI_API_KEY
  timeout_s: 15
  max_output_tokens: 1024     # 200 cut the JSON off on a thinking model (bad_answer on the hosted check)
  max_path_words: 12
  min_confidence: 0.7            # brand claim; not tuned yet: to be set from experiments/llm_eval.py
  phishing_min: 0.85             # raise on the model's own phishing probability; untuned
  cache_ttl_s: 86400             # one question per host and path words per day
  max_calls_per_day: 2000        # hard daily cap on provider calls (cost bound)
  hosted:                        # the Netlify Function copy (netlify/functions/llm-check.mjs)
    fallback_models: [gemini-3.5-flash-lite, gemini-3.1-flash-lite]  # tried in order when the main model answers 429/404/503
    timeout_s: 9                 # under the host's 10 s limit for a synchronous function
    max_calls_per_day: 300       # per function instance (instances do not share memory)
    cache_max_entries: 5000

short_links:                     # online URL check page: netlify/functions/expand.mjs follows a short link
  max_hops: 5                    # requests to shortener addresses at most; the destination itself is never requested
  timeout_s: 8                   # for the whole chain (the host stops a synchronous function at 10 s)
  max_body_bytes: 32768          # of a GET, read only to find a <meta http-equiv="refresh"> address
  cache_ttl_s: 3600
  cache_max_entries: 5000

rules:                           # heuristics, see backend/checks.py and reports/domain_rules.md
  very_young_domain_days: 7
  young_domain_days: 30
  free_issuers:                  # substrings of the certificate issuer (lowercase)
    - let's encrypt
    - zerossl
    - buypass
  severity_from_data:            # experiments/domain_rules.py: how the data picks a severity
    high_max_benign_upper: 0.01  # "high" only if the legit rate's 95% upper bound is <= this
    high_min_ratio: 10           # ... and phishing rate / legit upper bound >= this
    warn_min_ratio: 2            # "warn" if that ratio >= this, else "info"
  severity:                      # signal id -> high / warn / info, overrides the code's default;
    domain_unregistered: info    # set from reports/domain_rules.md (2026-10-13 captures): fires on
    tls_unverified: info         # 22.0% / 5.1% of legitimate hosts, no more often on phishing
  risk:
    elevated_warn_count: 1       # this many "warn" signals -> elevated
    high_warn_count: 3           # this many "warn" signals (or any "high") -> high
