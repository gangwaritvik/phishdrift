# Tier A base learners and the evaluation that `python -m experiments.tier_a` runs.
# Every split trains on its own train side only; cal is used for thresholds, test for metrics.
# The held-out source and the time slice are never trained or calibrated on.

seed: 42

eval:
  target_fprs: [0.01, 0.001]          # recall at these FPRs is the headline (CLAUDE.md)
  suspicious_rule: worst_source       # exported 'suspicious' = highest per-source cal 1% point (reports/threshold_transfer.md); dangerous stays pooled
  min_negatives: 10                   # fewer negatives than this: point is granularity-limited
  leakage_tripwire: 0.99              # any held-out result above this is investigated first
  shuffled_label_flag: 0.05           # negative controls: flag |mean AUC - 0.5| above this
  depth_top_bucket: 4                 # depth buckets 0, 1, 2, 3, 4+ (same as the corpus build)

# Features that separate sources more than classes (reports/tables/feature_source_check.csv,
# 2026-10-12 run). The GBDTs are trained with and without them; the decision follows the results.
source_flagged_features:
  - path_depth
  - n_slash
  - char_continuation_rate
  - entropy_url
  - n_letters
  - path_len
  - url_len
  - n_hyphen
  - special_ratio_url
  - letter_ratio_url
  - longest_repeat_run
  - n_com_tokens
  - path_ext_present
  - special_ratio_host
  - shortest_word_url
  - shortest_word_host
  - kw_in_path

lightgbm:
  n_estimators: 600
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0

xgboost:
  n_estimators: 600
  learning_rate: 0.05
  max_depth: 8
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  tree_method: hist

char_ngram:                           # TF-IDF of the masked canonical URL + logistic regression
  ngram_range: [3, 5]
  min_df: 3
  max_features: 500000
  sublinear_tf: true
  C: 4.0
  max_iter: 1000

loso:                                 # leave-one-source-out (experiments/loso.py)
  splits: [0, 1, 2]                   # train/cal sides of these splits; the left-out source is scored whole

stack:                                # experiments/stack_a.py
  n_folds: 5                          # domain-grouped folds for out-of-fold base scores
  meta_c: 1.0                         # inverse regularisation of the logistic-regression meta model

explain:                              # models/explain.py: reasons shown with a warning
  top: 3                              # at most this many reasons per URL
  min_logodds: 0.1                    # a feature must add at least this much log-odds to count

hybrid2:                              # second hybrid: adds path and word text models (gains_a, cal slices of splits 0-2)
  scorers:                            # each is an extra LightGBM input (out-of-fold log-odds)
    - {name: char_url, piece: url, kind: char, params: {max_features: 100000}}
    - {name: char_host, piece: host, kind: char, params: {max_features: 100000}}
    - {name: char_path, piece: path, kind: char, params: {min_df: 3, max_features: 60000}}
    - {name: word_url, piece: url, kind: word, params: {min_df: 2, C: 4.0, max_features: 60000}}

tier_c:                               # experiments/tier_c.py: domain/DNS/TLS features of live-feed hosts
  n_splits: 10                        # registrable-domain-grouped train/cal/test splits
  seed: 0                             # split k uses seed + k
  test_fraction: 0.2                  # 60/20/20 train/cal/test by rows (whole domains)
  cal_fraction: 0.25                  # share of the train side held for thresholds (0.25 * 0.8 = 0.2)
  min_rows_per_class: 20              # fewer eligible rows than this in either class: report counts only
  require_resolving: false            # rows are registrable domains (collector unit: domain): one that does not resolve stays, the deployed check meets those too
  max_capture_lag_h: 14               # rows captured later than this after first seen are dropped (hourly polling and feed-side first-seen times make a few hours normal)
  control_shuffles: 5                 # shuffled-label control: this many shuffles per split (few positives make one draw noisy)
  sensitivity_lag_h: 2                # the report repeats the main model on rows captured within this many hours
  time_check:
    min_days: 3                       # distinct capture days needed for the newest-days check
    test_fraction: 0.25               # newest capture days holding about this share of rows are test
  no_age_drop:                        # the "no age" variant drops these
    - domain_age_days
    - registration_length_days
    - days_to_expiry
    - days_since_rdap_change
    - cert_age_days
  serving:                            # hosted domain check (netlify/functions/domain-check.mjs), exported in the bundle
    cache_ttl_s: 3600                 # answer kept per registrable domain
    cache_max_entries: 2000
    rdap_timeout_ms: 4000
    total_timeout_ms: 9000            # the whole check; a part that did not finish is NaN, as in capture
  lightgbm:                           # small-data settings
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 10
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

robustness:                           # experiments/robustness.py: URL evasion families (attacks/), hybrid2 model
  splits: [0, 1, 2, 3, 4, 5]          # split k trains the adversarial model without family families[k % 6]
  seed: 7                             # transform seed
  train_fraction: 0.12                # share of train rows (both classes) given one variant per training family
  eval_phishing: 4000                 # test phishing URLs per family (same rows for every family)
  eval_benign: 6000                   # test benign URLs per family for the false-alarm side
  long_url_quantile: 0.95             # "long legitimate URLs" = benign test URLs above this length quantile

threshold_transfer:                   # experiments/threshold_transfer.py: do the cal-side FPR thresholds hold elsewhere?
  model: hybrid2                      # address model whose thresholds are compared (the one in the extension)
  splits: null                        # null = every split in splits.parquet (main setting)
  cache_dir: data/interim/threshold_transfer  # scores per split / left-out source (retraining skipped when present)
  balanced_min_negatives: 200         # source-balanced rule: sources with fewer cal negatives get no weight
  confidence: 0.95                    # upper-confidence rules: target FPR must hold with this confidence
  n_bootstrap: 200                    # domain bootstrap replicates per source and target
  bootstrap_seed: 11                  # fixed seed for the domain bootstrap
  loso:
    splits: [0, 1, 2]                 # train/cal sides of these splits, without the left-out source
    model: hybrid2                    # hybrid2 (as shipped) or lightgbm (as experiments/loso.py, faster)
    skip_one_class: true              # sources with one class (no FPR to transfer) are not left out
