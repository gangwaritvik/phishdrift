# Brand and look-alike rules (features/brand_rules.py, js/src/brand_rules.js). Escalate-only
# signals next to the models; never model features. Lists come from data (features/brand_domains.py).

rules: [homograph, embedded, edit1, combo]   # address rules that are switched on
min_edit_len: 6        # edit1 compares only labels of at least this many characters
min_combo_len: 5       # combo needs a brand name of at least this many characters
# Lure words for combo = configs/lists/keywords.txt minus these (words a brand's own sites use).
lure_exclude: [bank, banking, netbanking, ebanking, free, gift, prize, limited, payment, invoice,
               wallet, support, cashback, reward, upi, billing, alert, urgent]

# What the extension does with a hit (extension/src/combine.js): a safe verdict becomes
# suspicious and a suspicious one dangerous. Never lowers anything.
escalate:
  address: [homograph, embedded, edit1, combo]
  page: true           # brand shown + credential field + not the brand's domain

sources:
  max_family: 500      # bigger families keep only domains whose label is one of their brand names
  misp_url: https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/{name}/list.json
  misp_lists: [microsoft, microsoft-office365, google]

# phishing_catcher-style host score (baseline only; experiments/brand_rules_eval.py).
catcher:
  free_levels: 1       # subdomain levels before each extra one adds weight
  weights:
    lure: 25           # each lure word among the host's words
    brand: 30          # a brand name on a host that is not the brand's
    brand_typo: 70     # one edit away from a brand label
    entropy: 10        # Shannon entropy of the host (bits per character)
    hyphen: 3          # each hyphen (not on punycode hosts)
    punycode: 30       # an xn-- label
    dot: 3             # each subdomain level beyond free_levels
    tld: 20            # TLD on configs/lists/suspicious_tlds.txt
