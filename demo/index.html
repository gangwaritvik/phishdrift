<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishDrift URL check</title>
<link rel="icon" href="data:,">
<!-- extension/src imports ./lib/*.js, which the extension build copies from js/src -->
<script type="importmap">
{ "imports": { "../extension/src/lib/": "../js/src/" } }
</script>
<style>
  /* Light theme: white cards on a soft indigo-tinted background, one indigo accent;
     green / amber / red are kept for safe / suspicious / dangerous. */
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f3f5f9; --ink: #111827; --muted: #6b7280;
    --line: #e5e8ef; --accent: #4f46e5; --accent-soft: #eef0ff; --idle: #c7ccd6;
    --safe: #15803d; --safe-soft: #e8f7ee; --warn: #b45309; --warn-soft: #fef3e2; --bad: #dc2626; --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px rgba(17,24,39,.06);
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 500px at 50% -200px, #e6e8ff, transparent), var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  main { max-width: 920px; margin: 0 auto; padding: 48px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #6366f1, #4338ca); box-shadow: 0 6px 16px rgba(79,70,229,.3); }
  .logo svg { width: 22px; height: 22px; }
  h1 { font-size: 1.6rem; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .lede { margin: 0 0 18px; color: var(--muted); max-width: 64ch; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  form { display: flex; gap: 10px; }
  .field { flex: 1; min-width: 0; }
  input[type=text] {
    width: 100%; padding: 15px 16px; font: 1rem var(--mono); color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; outline: none; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .btn {
    padding: 0 22px; font: 600 1rem var(--sans); color: #fff; background: var(--accent); border: 0; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 16px rgba(79,70,229,.25);
  }
  .btn:hover { filter: brightness(1.1); } .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { padding: 7px 14px; font-size: .86rem; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: none; }
  .btn.ghost:hover { background: var(--accent-soft); filter: none; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 20px; color: var(--muted); font-size: .88rem; }
  .chip { padding: 5px 10px; font: .85rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: border-color .2s, color .2s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* step rail */
  .steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin: 0 0 14px; padding: 0; list-style: none; position: relative; }
  .steps::before { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 17px; height: 2px; background: var(--line); }
  .steps .prog { position: absolute; left: calc(100% / 12); top: 17px; height: 2px; width: 0; background: var(--accent); transition: width .6s var(--ease); }
  .step { position: relative; display: grid; justify-items: center; gap: 4px; padding: 0; background: none; border: 0; color: var(--muted); font: inherit; text-align: center; cursor: default; }
  .step .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--idle); transition: border-color .3s, background-color .3s, color .3s, transform .35s var(--ease); }
  .step .dot svg { width: 18px; height: 18px; }
  .step b { font-size: .8rem; font-weight: 600; line-height: 1.2; }
  .step small { font-size: .74rem; line-height: 1.2; min-height: 1.2em; opacity: 0; transition: opacity .3s; }
  .step.on .dot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .step.on b { color: var(--ink); }
  .step.done { cursor: pointer; } .step.done small { opacity: 1; }
  .step.done .dot { color: var(--surface); }
  .step.t-clear .dot, .step.t-safe .dot { background: var(--safe); border-color: var(--safe); } .step.t-clear small, .step.t-safe small { color: var(--safe); }
  .step.t-warn .dot { background: var(--warn); border-color: var(--warn); } .step.t-warn small { color: var(--warn); }
  .step.t-bad .dot { background: var(--bad); border-color: var(--bad); } .step.t-bad small { color: var(--bad); }
  .step.t-skip .dot, .step.t-na .dot { background: var(--surface); border: 2px dashed var(--idle); color: var(--idle); }

  /* stage */
  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 24px; box-shadow: var(--shadow); }
  .stage.v-safe { border-left: 4px solid var(--safe); }
  .stage.v-suspicious { border-left: 4px solid var(--warn); }
  .stage.v-dangerous { border-left: 4px solid var(--bad); }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .addr { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font: .85rem/1.45 var(--mono); word-break: break-all; }
  .addr .host { color: var(--ink); font-weight: 600; }
  .addr .via { font-family: var(--sans); color: var(--muted); }
  .ctl { display: flex; gap: 8px; flex: none; }
  .scenes { display: grid; }
  .scene { grid-area: 1 / 1; min-width: 0; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .35s, transform .45s var(--ease), visibility 0s .35s; }
  .scene.cur { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .kicker { margin: 0; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .scene h2 { margin: 2px 0 16px; font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
  .lead { margin: 0 0 16px; color: var(--muted); max-width: 70ch; min-height: 1.5em; }
  .rv { opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .45s var(--ease); }
  .rv.show { opacity: 1; transform: none; }
  .fast .rv, .fast .scene, .fast .step, .fast .step * { transition-duration: 0s !important; }
  code, .mono { font-family: var(--mono); }
  .note { margin: 12px 0 0; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: .88rem; }
  .result { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 6px 10px; border-radius: 10px; font-weight: 600; background: var(--surface-2); }
  .result svg { width: 18px; height: 18px; }
  .result.t-clear, .result.t-safe { background: var(--safe-soft); color: var(--safe); }
  .result.t-warn { background: var(--warn-soft); color: var(--warn); }
  .result.t-bad { background: var(--bad-soft); color: var(--bad); }

  /* scene 1: allowlist */
  .urlparts { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px; font: 1.35rem var(--mono); margin: 4px 0 6px; }
  .seg { padding: 4px 10px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .seg.dom { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .cap { font-size: .82rem; color: var(--muted); margin: 0 0 14px; }
  .lookup { display: grid; gap: 10px; }
  .hashline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
  .hash { padding: 5px 10px; border-radius: 10px; background: var(--surface-2); color: var(--ink); font: .92rem var(--mono); letter-spacing: .04em; min-width: 11ch; }
  .scan { position: relative; height: 36px; border-radius: 10px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
  .scan::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-soft); }
  .scan.run::after { animation: scan 1s linear forwards; }
  @keyframes scan { to { width: 100%; } }
  .scan .count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: .85rem var(--mono); background: var(--surface); padding: 2px 8px; border-radius: 6px; }

  /* scene 2: blocklist */
  .keys { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .keyrow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto 26px; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); font-size: .88rem; }
  .keyrow .tag { font-size: .8rem; color: var(--muted); }
  .keyrow .k { font-family: var(--mono); overflow-wrap: anywhere; }
  .keyrow .h { font-family: var(--mono); color: var(--muted); font-size: .8rem; }
  .keyrow .st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--idle); color: var(--surface); transition: background-color .3s, transform .35s var(--ease); transform: scale(.7); }
  .keyrow .st svg { width: 13px; height: 13px; }
  .keyrow.checking .st { background: var(--accent); transform: scale(1); animation: pulse .8s ease-in-out infinite; }
  .keyrow.ok .st { background: var(--safe); transform: scale(1); }
  .keyrow.hit { background: var(--bad-soft); } .keyrow.hit .st { background: var(--bad); transform: scale(1); }
  .keyrow.off .st { background: var(--idle); transform: scale(1); }
  @keyframes pulse { 50% { opacity: .45; } }

  /* scene 3: model */
  .gauge { position: relative; height: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--zones); margin: 28px 0 34px; }
  .gauge .mk { position: absolute; top: -9px; width: 6px; height: 32px; margin-left: -3px; border-radius: 3px; background: var(--ink); transition: left .7s var(--ease); left: var(--p0, 10%); }
  .gauge .tk { position: absolute; top: -6px; bottom: -6px; border-left: 2px dashed var(--muted); }
  .gauge .tk span { position: absolute; top: calc(100% + 4px); left: 0; transform: translateX(-50%); font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .gauge .val { position: absolute; top: -30px; left: 0; transform: translateX(-50%); font: 650 .85rem var(--mono); transition: left .7s var(--ease); white-space: nowrap; }
  .clues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .clue { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: center; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); font-size: .9rem; }
  .delta { justify-self: end; min-width: 62px; text-align: center; padding: 2px 6px; border-radius: 3px; font: 600 .82rem var(--mono); }
  .delta.up { background: var(--bad-soft); color: var(--bad); } .delta.down { background: var(--safe-soft); color: var(--safe); } .delta.flat { background: var(--line); color: var(--muted); }
  .clue.total { background: transparent; border: 1px solid var(--line); font-weight: 600; }

  /* scene 5: combiner */
  .ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; position: relative; margin: 22px 0 18px; }
  .ladder::before { content: ""; position: absolute; left: 16.6%; right: 16.6%; top: 22px; height: 3px; background: var(--line); border-radius: 2px; }
  .rung { position: relative; display: grid; justify-items: center; gap: 6px; font-weight: 600; color: var(--muted); }
  .rung i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 3px solid var(--idle); font-style: normal; transition: border-color .4s, background-color .4s, color .4s; }
  .rung.lit.r0 i { border-color: var(--safe); background: var(--safe-soft); color: var(--safe); } .rung.lit.r1 i { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); } .rung.lit.r2 i { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .rung i svg { width: 20px; height: 20px; }
  .token { position: absolute; top: 12px; left: var(--tp, 16.6%); width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--accent); z-index: 2; transition: left .8s var(--ease), background-color .4s; }
  .tstep { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 0 0 8px; border-radius: 10px; background: var(--surface-2); }

  /* scene 6: verdict */
  .vgrid { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 22px; align-items: center; }
  .shield { width: 110px; height: 110px; color: var(--idle); transition: color .4s; }
  .shield path { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .shield .bodyfill { fill: currentColor; fill-opacity: 0; transition: fill-opacity .5s .2s; }
  .shield .mark { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset .6s .35s var(--ease); }
  .v-safe .shield { color: var(--safe); } .v-suspicious .shield { color: var(--warn); } .v-dangerous .shield { color: var(--bad); }
  .v-safe .shield .bodyfill, .v-suspicious .shield .bodyfill, .v-dangerous .shield .bodyfill { fill-opacity: .14; }
  .shield .mark { display: none; }
  .v-safe .shield .m-safe, .v-suspicious .shield .m-warn, .v-dangerous .shield .m-bad { display: inline; stroke-dashoffset: 0; }
  .vword { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
  .v-safe .vword { color: var(--safe); } .v-suspicious .vword { color: var(--warn); } .v-dangerous .vword { color: var(--bad); }
  .vsub { margin: 2px 0 14px; color: var(--muted); }
  .reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
  .reasons li { padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: .92rem; }

  .err { margin-top: 14px; color: var(--bad); font-size: .9rem; }

  .loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(245,247,251,.92); backdrop-filter: blur(4px); transition: opacity .35s, visibility 0s .35s; }
  .loader.gone { opacity: 0; visibility: hidden; }
  .lcard { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); }
  .lcard h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .lbar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .lbar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s var(--ease); }
  .lfiles { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .85rem; }
  .lfiles li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); }
  .lfiles code { overflow-wrap: anywhere; } .lfiles span { color: var(--muted); white-space: nowrap; }
  .lfiles li.done span { color: var(--safe); }

  @media (max-width: 760px) {
    .steps b { font-size: .7rem; } .steps small { display: none; }
    .step .dot { width: 32px; height: 32px; } .steps::before, .steps .prog { top: 15px; }
    .bar { flex-wrap: wrap; } .ctl { width: 100%; }
    .tilerow { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .vgrid { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } .reasons { text-align: left; width: 100%; }
    .keyrow { grid-template-columns: minmax(0, 1fr) auto 26px; } .keyrow .tag { display: none; }
  }
  @media (max-width: 520px) {
    main { padding: 22px 16px 40px; } form { flex-direction: column; } .btn { padding: 14px; }
    .stage { padding: 16px; } .tile { width: 30px; height: 38px; font-size: 1.05rem; } .urlparts { font-size: 1.05rem; }
    .clue { grid-template-columns: 62px minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="lcard"><h2>Loading the detector</h2><div class="lbar"><i id="lbar"></i></div><ul class="lfiles" id="lfiles"></ul></div>
</div>
<main>
  <header><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8.5 7 10 4-1.5 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></div><h1>Phish<span>Drift</span></h1></header>

  <form id="form">
    <div class="field"><input id="url" type="text" placeholder="https://example.com/login" autocomplete="off" spellcheck="false" aria-label="Web address"></div>
    <button id="go" class="btn" type="submit" disabled>Check</button>
  </form>
  <div class="examples" id="examples">Try:</div>

  <ol class="steps" id="steps" aria-label="Layers"><div class="prog" id="prog"></div></ol>

  <section class="stage" id="stage" aria-live="polite">
    <div class="bar">
      <div class="addr" id="addr">Waiting for an address</div>
      <div class="ctl"><button class="btn ghost" id="skip" type="button" disabled>Skip to verdict</button><button class="btn ghost" id="replay" type="button" disabled>Replay</button></div>
    </div>
    <div class="scenes" id="scenes"></div>
  </section>

  <p class="err" id="info"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
