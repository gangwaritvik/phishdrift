<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishDrift URL check</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;800&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap">
<!-- extension/src imports ./lib/*.js, which the extension build copies from js/src -->
<script type="importmap">
{ "imports": { "../extension/src/lib/": "../js/src/" } }
</script>
<link rel="stylesheet" href="../extension/src/theme.css">
<style>
  /* theme tokens, the lens and the ripple: ../extension/src/theme.css */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; padding-bottom: 48px; transition: background-color .3s; }
  [data-theme=midnight] body { background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 24px 24px; }
  [data-theme=terminal] body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.22) 2px 3px); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 22px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font: var(--dw) 22px var(--display); flex: none; }
  .mk { width: 36px; height: 36px; border-radius: calc(var(--r) / 2); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  form.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--card); border: max(var(--bw), 1px) solid var(--line); border-radius: var(--pill); padding: 5px 5px 5px 18px; box-shadow: var(--shadow); }
  form.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: 15px var(--mono); outline: none; }
  .btn { font: 600 15px var(--body); padding: 0 20px; min-height: 44px; border-radius: var(--pill); border: max(var(--bw), 1px) solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  [data-theme=pop] .btn { box-shadow: 3px 3px 0 #111; border-color: #111; }
  /* the lens: one round swatch per theme; picking one ripples the theme out from that swatch */
  .card { background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; font-size: 14px; color: var(--mute); }
  .chip { padding: 6px 13px; border: max(var(--bw), 1px) solid var(--line); border-radius: var(--pill); background: var(--card); color: var(--fg); font-size: 14px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .xray { padding: 26px 32px 24px; animation: rise .55s both; }
  .xhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .url { position: relative; font: 500 34px/1.3 var(--mono); letter-spacing: -.02em; overflow-wrap: anywhere; padding: 22px 0 12px; overflow: hidden; }
  .url.long { font-size: 22px; }
  .url .dim { color: var(--mute); }
  .own { position: relative; display: inline-block; z-index: 0; padding: 0 5px; margin: 0 -5px; color: var(--hl-fg); }
  .own::before { content: ""; position: absolute; inset: 3px 0 1px; background: var(--hl); border-radius: 5px; z-index: -1; transform: scaleX(0); transform-origin: left; animation: draw .45s 1.05s ease-out forwards; }
  .beam { position: absolute; top: 12px; bottom: 4px; width: 110px; left: -120px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 28%, transparent)); border-right: 2px solid var(--accent); animation: scan 1.6s .2s cubic-bezier(.45,0,.25,1) forwards; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; animation: rise .4s 1.2s both; }
  .lchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--pill); border: max(var(--bw), 1px) solid var(--line); font-size: 13.5px; }
  .sw { width: 14px; height: 10px; border-radius: 3px; background: var(--hl); }
  .relay { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 24px; padding-top: 22px; border-top: 1px dashed var(--line); }
  .relay::before, .rfill { content: ""; position: absolute; top: 38px; left: 10%; right: 10%; height: 2px; background: var(--line); }
  .rfill { background: var(--tone); transform: scaleX(0); transform-origin: left; animation: draw 1.5s 1s linear forwards; }
  .node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 0 4px; }
  .node i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--line); margin-bottom: 6px; animation: pop .35s both cubic-bezier(.2,.8,.2,1.4); animation-delay: calc(1s + var(--k) * .35s); }
  .node i svg { width: 16px; height: 16px; }
  .node.clear i, .node.safe i { border-color: var(--safe); color: var(--safe); }
  .node.warn i { background: var(--warn); border-color: var(--warn); color: #fff; }
  .node.bad i { background: var(--bad); border-color: var(--bad); color: #fff; }
  .node.skip i, .node.na i { border-style: dashed; color: var(--mute); }
  .node b { font-weight: 600; font-size: 14px; }
  .node span { font: 13px var(--mono); color: var(--mute); }
  .node.warn span { color: var(--warn); } .node.bad span { color: var(--bad); } .node.safe span, .node.clear span { color: var(--safe); }
  .stage { position: relative; overflow: hidden; margin-top: 20px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 56px; align-items: center; padding: 40px 52px; }
  .stage.nodial { grid-template-columns: 1fr; }
  .stage::before { content: ""; position: absolute; inset: 0; background: var(--stage); transform: scaleX(0); transform-origin: left; animation: draw .7s 2.7s cubic-bezier(.7,0,.2,1) forwards; }
  .stage > * { position: relative; z-index: 1; }
  .dial { position: relative; width: 280px; height: 280px; animation: rise .5s 1.2s both; }
  .dial svg { width: 100%; height: 100%; display: block; }
  .dial .track { stroke: var(--track); }
  .dial .arc { stroke: var(--safe); }
  .dial .tick { stroke: var(--fg); }
  [data-theme=midnight] .dial .arc { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--tone) 60%, transparent)); }
  .dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .dc .eyebrow { text-align: center; padding: 0 30px; line-height: 1.3; } .num { font: var(--dw) 56px/1 var(--display); letter-spacing: -.03em; }
  [data-theme=terminal] .num { font-size: 78px; }
  .dlab { display: flex; justify-content: space-between; gap: 14px; width: 280px; font: 12px var(--mono); color: var(--mute); margin-top: -16px; padding: 0 12px; }
  .word { display: flex; flex-wrap: wrap; font: var(--dw) 104px/.95 var(--display); letter-spacing: -.04em; color: var(--tone); margin: 12px 0 18px; }
  [data-theme=pop] .word { font-size: 84px; letter-spacing: -.02em; }
  [data-theme=terminal] .word { font-size: 140px; letter-spacing: 0; }
  [data-theme=midnight] .word { text-shadow: 0 0 34px color-mix(in srgb, var(--tone) 35%, transparent); }
  .word span { display: inline-block; white-space: pre; animation: letter .55s both cubic-bezier(.2,.8,.2,1.25); animation-delay: calc(2.85s + var(--k) * .05s); }
  .vt .eyebrow { animation: rise .4s 2.75s both; }
  .say { font-size: 20px; line-height: 1.45; max-width: 600px; margin: 0 0 12px; animation: rise .5s 3.3s both; }
  .says { margin: 0 0 24px; padding: 0; list-style: none; display: grid; gap: 6px; max-width: 640px; animation: rise .5s 3.4s both; }
  .says li { color: var(--mute); font-size: 15.5px; padding-left: 18px; position: relative; }
  .says li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); }
  .acts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; animation: rise .5s 3.5s both; }
  .tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
  .tier { padding: 20px 22px; animation: deal .6s both cubic-bezier(.2,.8,.2,1.15); animation-delay: calc(3.3s + var(--k) * .12s); }
  .tier h3 { font: var(--dw) 22px/1.2 var(--display); margin: 10px 0 8px; }
  .tier p { margin: 4px 0 0; font-size: 14.5px; color: var(--mute); }
  .tv.safe { color: var(--safe); } .tv.warn { color: var(--warn); } .tv.bad { color: var(--bad); } .tv.skip { color: var(--mute); }
  .clues { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
  .clue { padding: 22px 22px 20px; animation: deal .6s both cubic-bezier(.2,.8,.2,1.15); animation-delay: calc(3.45s + var(--k) * .12s); }
  .ck { display: flex; justify-content: space-between; align-items: center; }
  .ic { width: 42px; height: 42px; border-radius: calc(var(--r) / 2); display: grid; place-items: center; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .ic svg { width: 20px; height: 20px; }
  .clue h3 { font: var(--dw) 19px/1.25 var(--display); margin: 16px 0 14px; min-height: 2.5em; }
  [data-theme=terminal] .clue h3 { font-size: 26px; }
  .push { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--mute); }
  .push .b { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .push .b i { display: block; height: 100%; background: var(--bad); transform: scaleX(0); transform-origin: left; animation: draw .7s forwards; animation-delay: calc(3.9s + var(--k) * .1s); }
  .notes { margin: 20px 0 0; padding: 14px 18px; border: 1px dashed var(--line); border-radius: calc(var(--r) / 2); color: var(--mute); font-size: 14.5px; animation: rise .5s 3.6s both; }
  .notes p { margin: 0; } .notes p + p { margin-top: 6px; }
  .meta { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font: 12px var(--mono); color: var(--mute); margin-top: 22px; }
  .err { color: var(--bad); }
  .loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(4px); transition: opacity .35s, visibility 0s .35s; }
  .loader.gone { opacity: 0; visibility: hidden; }
  .lcard { width: min(440px, 100%); background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 22px 24px; box-shadow: var(--shadow); }
  .lcard h2 { margin: 0 0 12px; font: var(--dw) 1.2rem var(--display); }
  .lbar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .lbar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s; }
  .lfiles { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .85rem; }
  .lfiles li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 10px; background: var(--track); }
  .lfiles code { overflow-wrap: anywhere; } .lfiles span { color: var(--mute); white-space: nowrap; }
  .lfiles li.done span { color: var(--safe); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { transform: scaleX(1); } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes scan { 0% { left: -120px; opacity: 1; } 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
  @keyframes letter { from { opacity: 0; transform: translateY(55%) rotate(10deg); } to { opacity: 1; transform: none; } }
  @keyframes deal { from { opacity: 0; transform: translateY(46px) rotate(-4deg); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * , *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } }
  @media (max-width: 900px) { .tiers { grid-template-columns: 1fr; } .clues { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stage { gap: 32px; padding: 32px 28px; } }
  @media (max-width: 760px) {
    .wrap { padding: 0 16px; } .bar { flex-wrap: wrap; gap: 12px; } form.search { order: 3; flex-basis: 100%; } .tmenu { margin-left: auto; }
    .xray { padding: 20px 18px; } .xhead { flex-direction: column; align-items: flex-start; gap: 4px; }
    .url { font-size: 20px; } .beam { display: none; }
    .node span { display: none; } .node b { font-size: 12px; }
    .stage { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 28px 18px; }
    .dial { width: 230px; height: 230px; } .dlab { width: 230px; } .num { font-size: 46px; }
    .word { font-size: 60px; justify-content: center; } [data-theme=pop] .word { font-size: 48px; } [data-theme=terminal] .word { font-size: 90px; }
    .say { font-size: 17px; } .says { text-align: left; } .acts { justify-content: center; }
    .clues { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-verdict="safe">
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="lcard"><h2>Loading the detector</h2><div class="lbar"><i id="lbar"></i></div><ul class="lfiles" id="lfiles"></ul></div>
</div>
<div class="wrap">
  <header class="bar">
    <div class="logo"><span class="mk"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-6 6-6 9-2s6 3 9-4"/><circle cx="19" cy="6" r="1.6" fill="currentColor" stroke="none"/></svg></span>PhishDrift</div>
    <form class="search" id="form">
      <input type="text" id="url" aria-label="Link to check" placeholder="Paste a link to check" autocomplete="off" spellcheck="false" autocapitalize="off">
      <button class="btn" id="go" type="submit" disabled>Check</button>
    </form>
    <div class="lens" id="lens" role="radiogroup" aria-label="Theme"></div>
    <button class="btn ghost" id="replay" type="button" aria-label="Replay the animation"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay</button>
  </header>
  <div class="examples" id="examples"><span>Try:</span></div>
  <main id="out" aria-live="polite"></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
